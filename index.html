<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Приймальний 24 — Учёт смены</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-top">
      <h1>Приймальний 24</h1>
      <button id="clear-shift-btn" class="danger-btn">Сдать смену</button>
    </div>
    <div class="tabs">
      <button id="tab-all" class="tab active">Все (<span id="count-all">0</span>)</button>
      <button id="tab-pending" class="tab">Утро: Доделать (<span id="count-pending">0</span>)</button>
    </div>
  </header>

  <main>
    <section class="add-card">
      <div class="section-heading">I. Карта пациента</div>

      <input type="text" id="patient-name" placeholder="1. ФИО (напр. Иванов Иван Иванович)" autocomplete="off">

      <div class="input-row">
        <input type="text" id="patient-dob" placeholder="2. Дата рождения (напр. 14.05.1990)" autocomplete="off">
        <input type="time" id="admission-time" title="7. Во сколько заехал">
      </div>

      <input type="text" id="patient-address" placeholder="3. Место жительства" autocomplete="off">

      <div class="work-block">
        <div class="input-row">
          <select id="work-status" class="select-input">
            <option value="unknown">4. Работает: не указано</option>
            <option value="no">4. Не работает</option>
            <option value="yes">4. Работает: Да</option>
          </select>
          <input type="text" id="patient-specialist" placeholder="6. К кому привезли (травматолог, невролог...)" autocomplete="off">
        </div>
        <div id="work-details-row" class="input-row hidden">
          <input type="text" id="work-place" placeholder="Где работает" autocomplete="off">
          <input type="text" id="work-role" placeholder="Кем работает" autocomplete="off">
        </div>
      </div>

      <input type="text" id="patient-diagnosis" placeholder="5. Диагноз" autocomplete="off">

      <div class="section-heading">II. К чему относится</div>

      <div class="category-chips" id="category-chips">
        <button type="button" class="cat-chip" data-cat="Болезнь (напр. ГМІ)">Болезнь / соматика (ГМІ)</button>
        <button type="button" class="cat-chip" data-cat="Криминал">1. Криминал</button>
        <button type="button" class="cat-chip" data-cat="Виробнича травма">2. Виробнича травма</button>
        <button type="button" class="cat-chip" data-cat="Невиробнича травма">3. Невиробнича травма</button>
        <button type="button" class="cat-chip" data-cat="ДТП">4. ДТП</button>
      </div>

      <div id="case-details-box" class="case-box hidden">
        <div class="input-row">
          <input type="text" id="case-time" placeholder="Во сколько травма / случай" autocomplete="off">
          <input type="text" id="case-place" placeholder="Где произошло" autocomplete="off">
        </div>
        <input type="text" id="case-what" placeholder="Обстоятельства (что случилось) / журнал" autocomplete="off">

        <div class="sub-box">
          <div class="sub-title">Алкоголь и воздух (проба)</div>
          <label class="checkbox-row">
            <input type="checkbox" id="sample-taken">
            <span>Набран алкоголь и воздух</span>
          </label>
          <div class="input-row">
            <input type="text" id="sample-number" placeholder="Какой номер" autocomplete="off">
            <input type="text" id="sample-time" placeholder="Во сколько набрана" autocomplete="off">
          </div>
        </div>

        <div id="police-102-box" class="police-box hidden">
          <div class="police-title">Передача в 102</div>
          <div class="input-row">
            <input type="text" id="police-time" placeholder="Во сколько передали" autocomplete="off">
            <input type="text" id="police-who" placeholder="Кто принял" autocomplete="off">
          </div>
        </div>
      </div>

      <div class="section-heading">III. Сделанные действия</div>

      <label class="checkbox-row action-check">
        <input type="checkbox" id="action-ecg">
        <span>1. ЭКГ</span>
      </label>

      <div class="sub-box">
        <div class="sub-title">2. Кровь</div>
        <div class="blood-grid">
          <label class="checkbox-row"><input type="checkbox" class="blood-cb" value="ОАК"><span>ОАК</span></label>
          <label class="checkbox-row"><input type="checkbox" class="blood-cb" value="БХ"><span>БХ</span></label>
          <label class="checkbox-row"><input type="checkbox" class="blood-cb" value="Алкоголь"><span>Алкоголь</span></label>
          <label class="checkbox-row"><input type="checkbox" class="blood-cb" value="Глюкоза"><span>Глюкоза</span></label>
          <label class="checkbox-row"><input type="checkbox" class="blood-cb" value="ПТИ"><span>ПТИ</span></label>
        </div>
        <input type="text" id="blood-extra" placeholder="Другая кровь / № / примечание..." autocomplete="off">
      </div>

      <div class="sub-box">
        <div class="sub-title">3. Показатели (первый замер при заезде)</div>
        <div class="input-row">
          <input type="text" id="vital-bp" placeholder="Давление (120/80)" autocomplete="off">
          <input type="text" id="vital-spo2" placeholder="Сатурация %" autocomplete="off">
        </div>
        <div class="input-row">
          <input type="text" id="vital-hr" placeholder="Пульс" autocomplete="off">
          <input type="text" id="vital-temp" placeholder="Температура" autocomplete="off">
        </div>
      </div>

      <div class="sub-box">
        <div class="sub-title">4. Итог: куда пойдёт</div>
        <div class="input-row">
          <select id="outcome-type" class="select-input">
            <option value="">Не определено</option>
            <option value="Госпитализация">Госпитализация</option>
            <option value="Амбулаторно">Амбулаторно</option>
          </select>
          <input type="text" id="outcome-dept" class="hidden" placeholder="В какое отделение..." autocomplete="off">
        </div>
      </div>

      <div class="photo-upload-row">
        <label class="photo-btn" for="patient-photo">📷 Фото</label>
        <input type="file" id="patient-photo" accept="image/*" capture="environment" class="hidden">
        <span id="photo-preview-name" class="photo-filename">Фото не выбрано</span>
        <button type="button" id="clear-photo-btn" class="small-btn del hidden">✕</button>
      </div>
      <img id="add-photo-preview" class="photo-thumb hidden" alt="Предпросмотр фото">

      <button id="add-btn" class="primary-btn">+ Записать заезд</button>
    </section>

    <section id="patients-list" class="patients-list"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
