<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Приймальний 24 — Учёт смены</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="snow-layer" class="snow-layer" aria-hidden="true"></div>

  <header>
    <div class="header-top">
      <h1>Приймальний 24 ❄️</h1>
      <button id="clear-shift-btn" class="danger-btn" type="button">Сдать смену</button>
    </div>
    <div class="tabs">
      <button id="tab-new" class="tab active" type="button">Новый заезд</button>
      <button id="tab-patients" class="tab" type="button">Пациенты (<span id="count-all">0</span>)</button>
      <button id="tab-pending" class="tab" type="button">Доделать (<span id="count-pending">0</span>)</button>
    </div>
  </header>

  <main>
    <section id="view-new" class="add-card">
      <div class="section-heading">Быстрый приём</div>

      <input type="text" id="patient-name" placeholder="Как зовут пациента (ФИО / палата)" autocomplete="off">

      <div class="input-row">
        <input type="text" id="patient-dob" placeholder="Дата рождения (напр. 14.05.1990)" autocomplete="off">
        <input type="time" id="admission-time" title="Во сколько заехал">
      </div>

      <div class="sub-box">
        <div class="sub-title">Причина заезда</div>
        <div class="reason-chips" id="reason-chips">
          <button type="button" class="reason-chip" data-reason="Болезнь">Болезнь</button>
          <button type="button" class="reason-chip" data-reason="Травма">Травма</button>
          <button type="button" class="reason-chip" data-reason="ДТП">ДТП</button>
        </div>
      </div>

      <div class="sub-box">
        <div class="sub-title">Замеры при заезде</div>
        <div class="input-row">
          <input type="text" id="vital-bp" placeholder="АД (120/80)" autocomplete="off">
          <input type="text" id="vital-hr" placeholder="Пульс" autocomplete="off">
        </div>
        <div class="input-row">
          <input type="text" id="vital-spo2" placeholder="Сатурация %" autocomplete="off">
          <input type="text" id="vital-temp" placeholder="Температура" autocomplete="off">
        </div>
      </div>

      <button id="add-btn" class="primary-btn" type="button">+ Добавить пациента</button>
    </section>

    <section id="view-list" class="patients-list hidden"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
